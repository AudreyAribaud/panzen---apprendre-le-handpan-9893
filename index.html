<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanZen - Apprendre le Handpan</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%230d9488%22/><circle cx=%2250%22 cy=%2250%22 r=%2215%22 fill=%22%23f59e0b%22/></svg>">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo-container">
        <div class="logo-icon"></div>
        <h1>PanZen</h1>
      </div>
      <p class="subtitle">Apprenez le Handpan à votre rythme</p>
    </header>

    <main>
      <!-- Mode Selector -->
      <div class="mode-selector">
        <button id="btn-free-play" class="mode-btn active">Jeu Libre</button>
        <button id="btn-lessons" class="mode-btn">Exercices</button>
      </div>

      <!-- Exercise Panel (Hidden in Free Play) -->
      <div id="exercise-panel" class="exercise-panel hidden">
        <div class="exercise-selector-wrapper">
          <label for="exercise-select">Choisir un exercice :</label>
          <select id="exercise-select">
            <!-- Populated by JS -->
          </select>
        </div>

        <!-- Fixed Sequence Display (Requested Feature) -->
        <div class="sequence-container">
          <h3>Séquence à jouer :</h3>
          <div id="sequence-display" class="sequence-display">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Controls -->
        <div class="exercise-controls">
          <button id="btn-demo" class="control-btn demo-btn">
            <span class="icon">▶</span> Voir la Démo
          </button>
          <button id="btn-practice" class="control-btn practice-btn">
            <span class="icon">🎯</span> S'entraîner
          </button>
        </div>

        <div id="feedback-message" class="feedback-message">
          Choisissez un exercice et lancez la démo ou l'entraînement !
        </div>
      </div>

      <!-- Handpan Instrument -->
      <div class="handpan-container">
        <svg id="handpan-svg" viewBox="0 0 500 500" width="100%" height="100%">
          <!-- Outer Shell -->
          <circle cx="250" cy="250" r="230" class="handpan-body" />
          <circle cx="250" cy="250" r="215" class="handpan-rim" />
          
          <!-- Ding (Center Note) -->
          <g id="note-D3" class="handpan-note ding" data-note="D3">
            <circle cx="250" cy="250" r="55" class="note-area" />
            <circle cx="250" cy="250" r="20" class="note-dimple" />
            <text x="250" y="255" class="note-label">Ding (D3)</text>
          </g>

          <!-- Surrounding Notes -->
          <!-- Note 1: A3 (Top) -->
          <g id="note-A3" class="handpan-note" data-note="A3">
            <ellipse cx="250" cy="95" rx="45" ry="30" class="note-area" />
            <circle cx="250" cy="95" r="10" class="note-dimple" />
            <text x="250" y="100" class="note-label">A3</text>
          </g>

          <!-- Note 2: Bb3 (Top-Right) -->
          <g id="note-Bb3" class="handpan-note" data-note="Bb3">
            <ellipse cx="360" cy="140" rx="45" ry="30" transform="rotate(35, 360, 140)" class="note-area" />
            <circle cx="360" cy="140" r="10" class="note-dimple" />
            <text x="360" y="145" class="note-label">B♭3</text>
          </g>

          <!-- Note 3: C4 (Right) -->
          <g id="note-C4" class="handpan-note" data-note="C4">
            <ellipse cx="405" cy="250" rx="45" ry="30" transform="rotate(90, 405, 250)" class="note-area" />
            <circle cx="405" cy="250" r="10" class="note-dimple" />
            <text x="405" y="255" class="note-label">C4</text>
          </g>

          <!-- Note 4: D4 (Bottom-Right) -->
          <g id="note-D4" class="handpan-note" data-note="D4">
            <ellipse cx="360" cy="360" rx="45" ry="30" transform="rotate(145, 360, 360)" class="note-area" />
            <circle cx="360" cy="360" r="10" class="note-dimple" />
            <text x="360" y="365" class="note-label">D4</text>
          </g>

          <!-- Note 5: E4 (Bottom) -->
          <g id="note-E4" class="handpan-note" data-note="E4">
            <ellipse cx="250" cy="405" rx="45" ry="30" class="note-area" />
            <circle cx="250" cy="405" r="10" class="note-dimple" />
            <text x="250" y="410" class="note-label">E4</text>
          </g>

          <!-- Note 6: F4 (Bottom-Left) -->
          <g id="note-F4" class="handpan-note" data-note="F4">
            <ellipse cx="140" cy="360" rx="45" ry="30" transform="rotate(35, 140, 360)" class="note-area" />
            <circle cx="140" cy="360" r="10" class="note-dimple" />
            <text x="140" y="365" class="note-label">F4</text>
          </g>

          <!-- Note 7: G4 (Left) -->
          <g id="note-G4" class="handpan-note" data-note="G4">
            <ellipse cx="95" cy="250" rx="45" ry="30" transform="rotate(90, 95, 250)" class="note-area" />
            <circle cx="95" cy="250" r="10" class="note-dimple" />
            <text x="95" y="255" class="note-label">G4</text>
          </g>

          <!-- Note 8: A4 (Top-Left) -->
          <g id="note-A4" class="handpan-note" data-note="A4">
            <ellipse cx="140" cy="140" rx="45" ry="30" transform="rotate(145, 140, 140)" class="note-area" />
            <circle cx="140" cy="140" r="10" class="note-dimple" />
            <text x="140" y="145" class="note-label">A4</text>
          </g>
        </svg>
      </div>
    </main>

    <footer>
      <p>PanZen - Conçu pour la relaxation et l'apprentissage. Fonctionne hors-ligne.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
