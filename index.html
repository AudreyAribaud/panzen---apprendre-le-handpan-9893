<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanZen - Apprendre le Handpan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-circle-notch logo-icon"></i>
                <div>
                    <h1>PanZen</h1>
                    <p class="subtitle">Apprenez le Handpan intuitivement</p>
                </div>
            </div>
            <div class="header-controls">
                <button id="btn-metronome" class="control-btn" title="Métronome">
                    <i class="fa-solid fa-drum"></i> <span id="bpm-display">120 BPM</span>
                </button>
                <button id="btn-freeplay" class="control-btn active" title="Mode Libre">
                    <i class="fa-solid fa-hand"></i> Libre
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Left Panel: Song Library & Partition -->
            <section class="sidebar">
                <div class="panel song-selector">
                    <h2><i class="fa-solid fa-music"></i> Morceaux à jouer</h2>
                    <div class="song-list" id="song-list">
                        <!-- Songs will be injected here -->
                    </div>
                </div>

                <div class="panel partition-panel" id="partition-panel">
                    <div class="partition-header">
                        <h2><i class="fa-solid fa-book-open"></i> Partition active</h2>
                        <div class="partition-actions">
                            <button id="btn-play-demo" class="action-btn" title="Écouter la démo">
                                <i class="fa-solid fa-play"></i> Démo
                            </button>
                            <button id="btn-reset-song" class="action-btn" title="Recommencer">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>
                        </div>
                    </div>
                    <div class="partition-container">
                        <div class="partition-flow" id="partition-flow">
                            <p class="empty-msg">Sélectionnez un morceau pour afficher sa partition.</p>
                        </div>
                    </div>
                    <div class="partition-instructions" id="partition-instructions">
                        Choisissez un morceau et jouez les notes en surbrillance !
                    </div>
                </div>
            </section>

            <!-- Right Panel: Virtual Handpan -->
            <section class="handpan-section">
                <div class="handpan-container">
                    <div class="handpan" id="handpan">
                        <!-- Ding (Central Note) -->
                        <div class="handpan-note ding" data-note="D3" data-frequency="146.83">
                            <span class="note-label">D3</span>
                            <span class="note-name">Ding</span>
                        </div>
                        <!-- Outer Notes -->
                        <div class="handpan-note outer-note note-1" data-note="A3" data-frequency="220.00">
                            <span class="note-label">A3</span>
                        </div>
                        <div class="handpan-note outer-note note-2" data-note="Bb3" data-frequency="233.08">
                            <span class="note-label">B♭3</span>
                        </div>
                        <div class="handpan-note outer-note note-3" data-note="C4" data-frequency="261.63">
                            <span class="note-label">C4</span>
                        </div>
                        <div class="handpan-note outer-note note-4" data-note="D4" data-frequency="293.66">
                            <span class="note-label">D4</span>
                        </div>
                        <div class="handpan-note outer-note note-5" data-note="E4" data-frequency="329.63">
                            <span class="note-label">E4</span>
                        </div>
                        <div class="handpan-note outer-note note-6" data-note="F4" data-frequency="349.23">
                            <span class="note-label">F4</span>
                        </div>
                        <div class="handpan-note outer-note note-7" data-note="G4" data-frequency="392.00">
                            <span class="note-label">G4</span>
                        </div>
                        <div class="handpan-note outer-note note-8" data-note="A4" data-frequency="440.00">
                            <span class="note-label">A4</span>
                        </div>
                    </div>
                </div>
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                </div>
            </section>
        </main>

        <footer>
            <p>Gamme : Ré Mineur Kurd (D Kurd) • Cliquez ou touchez les notes pour jouer.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
