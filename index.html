<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panzen - Apprendre le Handpan</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1>Panzen</h1>
      <div class="header-actions">
        <button id="btn-sound-init" class="btn-icon" title="Activer le son">
          <i class="fas fa-volume-mute" id="sound-icon"></i>
        </button>
        <button id="btn-info" class="btn-icon" title="Aide">
          <i class="fas fa-question-circle"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- VIEW: PLAY (Virtual Handpan) -->
      <section id="view-play" class="view active">
        <div class="handpan-container">
          <div class="handpan-svg-wrapper">
            <svg class="handpan-svg" viewBox="0 0 400 400">
              <defs>
                <radialGradient id="handpan-gradient" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#4a3f35" />
                  <stop offset="70%" stop-color="#231d19" />
                  <stop offset="100%" stop-color="#120e0c" />
                </radialGradient>
                <radialGradient id="ding-gradient" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#e0a96d" />
                  <stop offset="40%" stop-color="#8a6240" />
                  <stop offset="100%" stop-color="#231d19" />
                </radialGradient>
                <radialGradient id="note-gradient" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#5c4a3c" />
                  <stop offset="70%" stop-color="#2d241e" />
                  <stop offset="100%" stop-color="#1a1411" />
                </radialGradient>
              </defs>
              
              <!-- Outer Shell -->
              <circle class="handpan-shell" cx="200" cy="200" r="180" />
              
              <!-- Ding (Center Note) -->
              <g class="handpan-ding" id="note-ding" data-note="D3">
                <circle cx="200" cy="200" r="45" />
                <circle cx="200" cy="200" r="15" fill="rgba(0,0,0,0.3)" />
                <text x="200" y="205" class="note-text">D3</text>
                <text x="200" y="230" class="hand-indicator hand-L">G</text>
              </g>

              <!-- Surrounding Notes (D Kurd Scale) -->
              <!-- Note 1: A3 (Bottom-Left) -->
              <g class="handpan-note" id="note-1" data-note="A3" transform="translate(0,0)">
                <ellipse cx="110" cy="260" rx="28" ry="22" transform="rotate(-30 110 260)" />
                <text x="110" y="264" class="note-text">A3</text>
                <text x="110" y="248" class="hand-indicator hand-L">G</text>
              </g>

              <!-- Note 2: Bb3 (Left) -->
              <g class="handpan-note" id="note-2" data-note="Bb3">
                <ellipse cx="75" cy="170" rx="28" ry="22" transform="rotate(-75 75 170)" />
                <text x="75" y="174" class="note-text">B♭3</text>
                <text x="75" y="158" class="hand-indicator hand-L">G</text>
              </g>

              <!-- Note 3: C4 (Top-Left) -->
              <g class="handpan-note" id="note-3" data-note="C4">
                <ellipse cx="120" cy="90" rx="26" ry="20" transform="rotate(-120 120 90)" />
                <text x="120" y="94" class="note-text">C4</text>
                <text x="120" y="110" class="hand-indicator hand-R">D</text>
              </g>

              <!-- Note 4: D4 (Top) -->
              <g class="handpan-note" id="note-4" data-note="D4">
                <ellipse cx="200" cy="65" rx="26" ry="20" />
                <text x="200" y="69" class="note-text">D4</text>
                <text x="200" y="85" class="hand-indicator hand-R">D</text>
              </g>

              <!-- Note 5: E4 (Top-Right) -->
              <g class="handpan-note" id="note-5" data-note="E4">
                <ellipse cx="280" cy="90" rx="26" ry="20" transform="rotate(120 280 90)" />
                <text x="280" y="94" class="note-text">E4</text>
                <text x="280" y="110" class="hand-indicator hand-L">G</text>
              </g>

              <!-- Note 6: F4 (Right) -->
              <g class="handpan-note" id="note-6" data-note="F4">
                <ellipse cx="325" cy="170" rx="28" ry="22" transform="rotate(75 325 170)" />
                <text x="325" y="174" class="note-text">F4</text>
                <text x="325" y="158" class="hand-indicator hand-R">D</text>
              </g>

              <!-- Note 7: G4 (Bottom-Right) -->
              <g class="handpan-note" id="note-7" data-note="G4">
                <ellipse cx="290" cy="260" rx="28" ry="22" transform="rotate(30 290 260)" />
                <text x="290" y="264" class="note-text">G4</text>
                <text x="290" y="248" class="hand-indicator hand-R">D</text>
              </g>

              <!-- Note 8: A4 (Bottom) -->
              <g class="handpan-note" id="note-8" data-note="A4">
                <ellipse cx="200" cy="315" rx="30" ry="24" />
                <text x="200" y="319" class="note-text">A4</text>
                <text x="200" y="298" class="hand-indicator hand-L">G</text>
              </g>
            </svg>
          </div>
        </div>

        <!-- Metronome & Loop Controls -->
        <div class="controls-panel">
          <div class="metronome-row">
            <button id="btn-metronome-toggle" class="btn-primary">
              <i class="fas fa-play"></i> Métronome
            </button>
            <div class="bpm-slider-container">
              <span id="bpm-display">90 BPM</span>
              <input type="range" id="bpm-range" class="bpm-slider" min="60" max="180" value="90">
            </div>
          </div>
        </div>
      </section>

      <!-- VIEW: LEARN (Lessons & Exercises) -->
      <section id="view-learn" class="view">
        <h2 class="section-title">Cours & Exercices</h2>
        <div class="lessons-grid" id="lessons-container">
          <!-- Dynamic Lessons will be injected here -->
        </div>
      </section>

      <!-- VIEW: PRACTICE (Rhythm Game / Feedback) -->
      <section id="view-practice" class="view">
        <div class="practice-header">
          <h2 id="practice-title">Entraînement</h2>
          <p id="practice-desc" class="text-muted">Suivez le rythme et tapez sur les bonnes notes au bon moment.</p>
        </div>

        <div class="rhythm-visualizer">
          <div class="visualizer-line"></div>
          <div class="scrolling-notes" id="scrolling-notes-container"></div>
        </div>

        <div class="feedback-display" id="feedback-text">Prêt ?</div>

        <div class="text-center">
          <button id="btn-start-practice" class="btn-primary">Commencer l'exercice</button>
        </div>

        <!-- Mini Handpan for Practice View -->
        <div class="handpan-container mt-20">
          <div class="handpan-svg-wrapper" style="max-width: 260px;">
            <!-- Reused SVG for practice interaction -->
            <svg class="handpan-svg" viewBox="0 0 400 400" id="practice-handpan-svg">
              <!-- Content cloned dynamically or shared via interaction -->
            </svg>
          </div>
        </div>
      </section>

      <!-- VIEW: PROGRESS (Stats & History) -->
      <section id="view-progress" class="view">
        <h2 class="section-title">Votre Progression</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div>Cours Complétés</div>
            <div class="stat-value" id="stat-completed">0/6</div>
          </div>
          <div class="stat-card">
            <div>Précision Moyenne</div>
            <div class="stat-value" id="stat-accuracy">0%</div>
          </div>
        </div>

        <h3 class="section-title">Historique des sessions</h3>
        <div class="history-list" id="history-container">
          <div class="text-center text-muted" style="padding: 20px;">Aucune session enregistrée pour le moment.</div>
        </div>
      </section>
    </main>

    <!-- Navigation Bar -->
    <nav>
      <button class="nav-item active" data-view="play">
        <i class="fas fa-drum"></i>
        <span>Jouer</span>
      </button>
      <button class="nav-item" data-view="learn">
        <i class="fas fa-graduation-cap"></i>
        <span>Apprendre</span>
      </button>
      <button class="nav-item" data-view="practice">
        <i class="fas fa-dumbbell"></i>
        <span>Pratique</span>
      </button>
      <button class="nav-item" data-view="progress">
        <i class="fas fa-chart-line"></i>
        <span>Progrès</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
